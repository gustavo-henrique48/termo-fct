<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/cadastro.css" />
  <script src="../js/cadastro.js"></script>

  <title>Cadastro</title>

  <!-- Fonte Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">

  <!-- Fonte Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">


  <!-- Ícones para o cabeçalho-->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Ícone de localização -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=my_location" />
</head>

<body>
  <div class="container">

    <header class="header">
      <div class="box_logo">
        <img src="../images/logo.png" alt="Logo" />
      </div>

      <button class="box_login" onclick="window.location.href='login.html'">
        Login
      </button>

      <button class="box_jogo" onclick="window.location.href='jogo.html'">
        Jogar
      </button>

      <button class="box_estatistica" onclick="window.location.href='estatistica.html'">
        Estatística
      </button>
    </header>

    <div class="container">
      <form class="card">

        <h1>Cadastro</h1>

        <div class="grid-2">
          <input type="text" id="name" placeholder="Insira seu Nome" required>
          <input type="email" id="email" placeholder="exemplo@email.com" required>

          <input type="text" id="last_name" placeholder="Insira seu Sobrenome" required>
          <input type="password" id="senha" placeholder="Crie uma senha" required>

          <div class="empty"></div>
          <input type="password" id="senha2" placeholder="Repita sua senha" required>
        </div>

        <div class="genero-box">
          <label>Gênero:</label>
          <div class="generos">
            <input type="radio" name="genero" value="masculino"> Masculino
            <input type="radio" name="genero" value="feminino"> Feminino
            <input type="radio" name="genero" value="outro"> Outro
          </div>
        </div>

        <select required id="estado">
          <option value="">Escolha seu Estado</option>
          <option>SP</option>
          <option>RJ</option>
          <option>MG</option>
          <option>RS</option>
        </select>

        <input type="text" id="cidade" placeholder="Insira sua cidade" required>

        <div class="map-box">
          <iframe width="100%" height="100%" style="border:0; border-radius:12px;" loading="lazy" allowfullscreen
            src="https://www.google.com/maps/embed/v1/place?key=SUA_API_KEY&q=São+Paulo">
          </iframe>
        </div>

        <button type="submit" class="btn">Confirmar Cadastro</button>

      </form>
    </div>

  </div>
</body>


</html>
