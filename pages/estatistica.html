<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/stats.css" />
    <title>Termo</title>

    <!-- Fonte Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">

    <!-- Fonte Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">


    <!-- Ícones para o cabeçalho-->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />


<body>

    <div class="container">

        <header class="header">

            <div class="box_logo">
                <img src="../images/logo.png" alt="Logo" />
            </div>

            <div class="buttons">
                <button class="box_login" onclick="window.location.href='login.html'">
                    <span class="material-symbols-outlined">
                        account_circle
                    </span>
                    Sair
                </button>

                <button class="box_jogo" onclick="window.location.href='jogo.html'">
                    <span class="material-symbols-outlined">
                        stadia_controller
                    </span>
                    Jogar
                </button>

                <button class="box_estatistica" onclick="window.location.href='estatistica.html'">
                    <span class="material-symbols-outlined">
                        equalizer
                    </span>
                    Estatística
                </button>
            </div>

        </header>

        <main class="main">

            <div class="estatistica-container">

                <h1 class="titulo">Estatística</h1>

                <section class="tabela-estatistica">
                    <table>
                        <thead>
                            <tr>
                                <th></th>
                                <th>Vitórias</th>
                                <th>Derrotas</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Jogos</td>
                                <td>7</td>
                                <td>3</td>
                                <td>10</td>
                            </tr>
                            <tr>
                                <td>Maior tempo</td>
                                <td>00:20</td>
                                <td>00:15</td>
                                <td>00:20</td>
                            </tr>
                            <tr>
                                <td>Menor tempo</td>
                                <td>00:05</td>
                                <td>00:02</td>
                                <td>00:02</td>
                            </tr>
                            <tr>
                                <td>Porcentagem</td>
                                <td>70%</td>
                                <td>30%</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <hr class="divisor" />

                <h1 class="titulo">Distribuição de tentativas</h1>

                <section class="distribuicao">

                    <table>
                        <thead>
                            <tr>
                                <th></th>
                                <th>Jogos</th>
                                <th>Porcentagem</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>1</td>
                                <td>10%</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>0</td>
                                <td>0%</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>0</td>
                                <td>0%</td>
                            </tr>
                            <tr>
                                <td>4</td>
                                <td>0</td>
                                <td>0%</td>
                            </tr>
                            <tr>
                                <td>5</td>
                                <td>4</td>
                                <td>40%</td>
                            </tr>
                            <tr>
                                <td>6</td>
                                <td>2</td>
                                <td>20%</td>
                            </tr>
                            <tr>
                                <td>💀</td>
                                <td>3</td>
                                <td>30%</td>
                            </tr>
                        </tbody>
                    </table>
                </section>

            </div>

        </main>




    </div>

</body>

</html>
